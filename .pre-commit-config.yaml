# Run with prek (https://github.com/j178/prek) or pre-commit:
#   uv tool install prek && prek install && prek run --all-files
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
    - id: check-case-conflict
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-yaml
    - id: check-toml
    - id: debug-statements
    - id: mixed-line-ending
    # end-of-file-fixer and trailing-whitespace are left out for now: they
    # would touch ~90 existing files and conflict with open PRs.
    - id: name-tests-test
      args: ["--pytest-test-first"]
      # Shared skip helper imported by the tests, not a test module.
      exclude: ^tests/dbskip\.py$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    # Settings (including the baseline ignores and the notebooks exclude)
    # live in ruff.toml. ruff-format is not enabled yet; see the
    # tabedzki/style/ruff-format branch.
    - id: ruff-check
      args: ["--fix", "--show-fixes"]

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.22
  hooks:
    - id: uv-lock

- repo: https://github.com/abravalheri/validate-pyproject
  rev: "0.26"
  hooks:
    - id: validate-pyproject
