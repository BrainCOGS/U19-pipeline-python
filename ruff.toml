# Ruff configuration. This file takes precedence over any [tool.ruff] table in
# pyproject.toml, so keep all ruff settings here.

# Matches requires-python in pyproject.toml.
target-version = "py312"

# Ruff's default, kept explicit. pyproject.toml used to carry
# `line-length = 120` under [tool.ruff], but ruff never read it because this
# file exists, so 88 has always been the effective value. E501 is ignored
# below, so this only matters to `ruff format`.
line-length = 88

# Notebooks are exploratory and not linted.
extend-exclude = ["notebooks"]

[lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",
    # --- Baseline of pre-existing findings (Oct 2026), to burn down over time.
    # Rules with many hits are ignored repo-wide; rules with few hits are
    # ignored per file in [lint.per-file-ignores] so new code is still checked.
    #
    # Unused imports: do NOT autofix. DataJoint table definitions reference
    # imported schema modules only inside definition strings
    # (e.g. "-> lab.Lab"), which ruff cannot see.
    "F401",
    # Import sorting: would rewrite ~85 files and conflict with open PRs.
    "I001",
    # Imports after dj.config / sys.path setup are intentional in many modules.
    "E402",
    # Unused local variables (23 hits); removing them is a manual review job.
    "F841",
    # `== True` / `== False`: often used in DataJoint/pandas expressions where
    # `is` would change behavior.
    "E712",
    # Trailing semicolons (13 hits).
    "E703",
    # if/else -> ternary (11 hits), style only.
    "SIM108",
]

[lint.per-file-ignores]
