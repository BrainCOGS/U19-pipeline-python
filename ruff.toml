# Ruff configuration. This file takes precedence over any [tool.ruff] table in
# pyproject.toml, so keep all ruff settings here.

# Matches requires-python in pyproject.toml.
target-version = "py312"

# Ruff's default, kept explicit. pyproject.toml used to carry
# `line-length = 120` under [tool.ruff], but ruff never read it because this
# file exists, so 88 has always been the effective value. E501 is ignored
# below, so this only matters to `ruff format`.
line-length = 88

# Notebooks are exploratory and not linted.
extend-exclude = ["notebooks"]

[lint]
# extend-select keeps ruff's defaults (E4, E7, E9, F) and adds the BrainCOGS
# reference set (same as tech_calendar_streamlit).
extend-select = [
    "A",    # flake8-builtins: shadowing built-ins
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T100", # leftover breakpoints / debugger calls
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]

ignore = [
    "E501",
    # Reference ignores: mixedCase class attributes, argument shadowing a
    # builtin, non-lowercase local variable.
    "N815",
    "A002",
    "N806",
    # --- Baseline of pre-existing findings (Oct 2026), to burn down over time.
    # Rules with many hits are ignored repo-wide; rules with few hits are
    # ignored per file in [lint.per-file-ignores] so new code is still checked.
    #
    # Unused imports: do NOT autofix. DataJoint table definitions reference
    # imported schema modules only inside definition strings
    # (e.g. "-> lab.Lab"), which ruff cannot see.
    "F401",
    # Import sorting: would rewrite ~85 files and conflict with open PRs.
    "I001",
    # Imports after dj.config / sys.path setup are intentional in many modules.
    "E402",
    # Unused local variables (23 hits); removing them is a manual review job.
    "F841",
    # `== True` / `== False`: often used in DataJoint/pandas expressions where
    # `is` would change behavior.
    "E712",
    # Trailing semicolons (13 hits).
    "E703",
    # if/else -> ternary (11 hits), style only.
    "SIM108",
    # Rules added with extend-select (reference set plus ruff 0.16 defaults):
    # `dict()` calls -> literals (159 hits), style only.
    "C408",
    # Mutable class attributes: DataJoint Lookup tables declare `contents = [...]` this way by design.
    "RUF012",
    # `except Exception` (31 hits); narrowing needs per-site review.
    "BLE001",
    # `import a.b as b` -> `from a import b` (28 hits), style only.
    "PLR0402",
    # camelCase argument names (27 hits); renaming changes public call signatures.
    "N803",
    # `date.today()` without tz (25 hits): lab data is recorded in local time on purpose.
    "DTZ011",
    # `datetime.now()` without tz (20 hits): same reason as DTZ011.
    "DTZ005",
    # Non-lowercase function names (19 hits); renaming breaks callers and cron scripts.
    "N802",
    # Unused unpacked variables (15 hits), cleanup only.
    "RUF059",
]

[lint.per-file-ignores]
