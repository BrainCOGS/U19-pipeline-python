name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base dependencies + the dev group, on the lowest and highest
          # versions allowed by requires-python. Tests that need an optional
          # package skip themselves via pytest.importorskip; this leg checks
          # the package still works without the extras.
          - python-version: "3.12"
            deps: base
          - python-version: "3.14"
            deps: base
          # The `pipeline` extra (suite2p, cellpose, element-* git deps), so
          # the importorskip-guarded tests actually run. --require-extras
          # turns those skips into failures, so a broken install fails here
          # instead of passing with everything skipped.
          - python-version: "3.13"
            deps: pipeline
            pytest-args: --require-extras
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The audit job below covers the whole lock file regardless of leg.
      # The pipeline leg leaves out the locked torch, torchvision and their CUDA
      # wheels (~5 GB) and installs the CPU build of torch instead (next step).
      - name: Install dependencies
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          if [ "$DEPS" = pipeline ]; then
            mapfile -t skip < <(
              uv export --locked --extra pipeline --no-hashes --no-header --no-annotate \
                | grep -oE '^(torch|torchvision|triton|nvidia-[a-z0-9-]+|cuda-[a-z0-9-]+)\b' \
                | sort -u
            )
            echo "Not installing: ${skip[*]}"
            uv sync --locked --extra pipeline "${skip[@]/#/--no-install-package=}"
          else
            uv sync --locked
          fi

      # suite2p cannot be imported without torch (suite2p/version.py imports it)
      # or torchvision (cellpose.transforms, via suite2p.registration), and the
      # suite2p slurm job tests run the real suite2p on CPU. Install the CPU
      # builds of the torch and torchvision versions in uv.lock instead of the
      # CUDA wheels. --no-deps because the sync above installed their other
      # dependencies and the CPU index serves only torch packages. The `+cpu`
      # local version satisfies ==X.Y.Z.
      - name: Install CPU torch
        if: matrix.deps == 'pipeline'
        run: |
          mapfile -t pins < <(
            uv export --locked --extra pipeline --no-hashes --no-header --no-annotate \
              | grep -E '^(torch|torchvision)=='
          )
          echo "Installing ${pins[*]} from the PyTorch CPU index"
          uv pip install --no-deps "${pins[@]}" --index-url https://download.pytorch.org/whl/cpu

      # Tests marked `db` skip themselves when no DataJoint database is
      # reachable (see tests/dbskip.py); CI has none. -rs lists skip reasons.
      - name: Run tests
        env:
          PYTEST_ARGS: ${{ matrix.pytest-args }}
        # --no-sync keeps `uv run` from re-syncing the environment set up above,
        # which would replace the CPU torch with the locked CUDA build.
        run: uv run --no-sync pytest -rs $PYTEST_ARGS

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Audits the whole locked tree (all extras) against OSV and fails on any
      # finding. `--locked` also asserts uv.lock matches pyproject.toml.
      - name: Audit dependencies
        run: uv audit --locked
