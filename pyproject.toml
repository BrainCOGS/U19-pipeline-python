[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "u19-pipeline"
version = "0.4.0"
description = "Datajoint schemas for Princeton U19"
readme = "README.md"
authors = [
    { name = "DataJoint", email = "support@datajoint.com" },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu" },
]
dependencies = [
    "datajoint<2.0.0",
    "icalevents>=0.3.0",
    "numpy>=1.23",
    "pandas>=2.0",
    "python-dotenv>=0.20",
    "scikit-image",
    "scipy",
    "tables>=3.8",
    "astropy>=6.0",
    "openpyxl"
]
requires-python = ">=3.12"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.14",
    "jupyterlab>=4.3.4",
]
pipeline = [
    "cellpose",
    "bitstring",
    "fair-research-login",
    "ecephys_spike_sorting @ git+https://github.com/jenniferColonell/ecephys_spike_sorting.git",
    "element-array-ephys @ git+https://github.com/BrainCOGS/element-array-ephys.git",
    "element-calcium-imaging @ git+https://github.com/BrainCOGS/element-calcium-imaging.git",
    "element-interface @ git+https://github.com/datajoint/element-interface.git",
    "ecephys-spike-sorting>=0.1.0",
    "paramiko",
    "psutil",
    "scp",
    "scanreader @ git+https://github.com/BrainCOGS/scanreader.git",
    "six",
    "suite2p",
    "tifffile",
]

[tool.setuptools]
packages = {find = {include = ["u19_pipeline*", "scripts*"]}}


[tool.hatch.version]
path = "scripts/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/scripts",
    "/u19_pipeline",
]

[tool.ruff]
# if this is a library, enter the _minimum_ version you
# want to support, otherwise do py313
target-version = "py312"
line-length = 120  # use whatever number makes you happy
extend-exclude = ["*.ipynb", "**/*.ipynb"]

[tool.ruff.lint]
# you can see the looong list of rules here:
# https://docs.astral.sh/ruff/rules/
# here's a couple to start with
select = [
    "A",    # warn about shadowing built-ins
    "E",    # style stuff, whitespaces
    "F",    # important pyflakes lints
    "I",    # import sorting
    "N",    # naming
    "T100", # breakpoints (probably don't want these in prod!)
    "B",    # flake8-bugbear: likely bugs and design problems
    "SIM",  # flake8-simplify: code that can be simplified
    "UP",   # pyupgrade: syntax that can be modernized (e.g., old Python idioms)
    "C4",   # flake8-comprehensions: better list/dict/set comprehension patterns
]
# if you're feeling confident you can do:
# select = ["ALL"]
# and then manually ignore annoying ones:
ignore = ["N815", "A002", "N802", "N803", "N806", "E402", "E501", "SIM108"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.9.10",
    "setuptools>=75.8.0"
]

[tool.uv]
exclude-newer = "14 days"
