[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "u19-pipeline"
version = "0.4.0"
description = "Datajoint schemas for Princeton U19"
readme = "README.md"
authors = [
    { name = "DataJoint", email = "support@datajoint.com" },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu" },
]
dependencies = [
    "datajoint<2.0.0",
    "icalevents>=0.3.0",
    "numpy>=1.23",
    "pandas>=2.0",
    "python-dotenv>=0.20",
    "scikit-image",
    "scipy",
    "tables>=3.8",
    "astropy>=6.0",
    "openpyxl"
]
requires-python = ">=3.12"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.14",
    "jupyterlab>=4.3.4",
]
pipeline = [
    "cellpose",
    "bitstring",
    "fair-research-login",
    "ecephys_spike_sorting @ git+https://github.com/jenniferColonell/ecephys_spike_sorting.git",
    "element-array-ephys @ git+https://github.com/BrainCOGS/element-array-ephys.git",
    "element-calcium-imaging @ git+https://github.com/BrainCOGS/element-calcium-imaging.git",
    "element-interface @ git+https://github.com/datajoint/element-interface.git",
    "ecephys-spike-sorting>=0.1.0",
    "paramiko",
    "psutil",
    "scp",
    "scanreader @ git+https://github.com/BrainCOGS/scanreader.git",
    "six",
    "suite2p",
    "tifffile",
]
# The NWB converter. It aligns imaging to behavior from the TIFF headers' I2C
# packets and verifies what it writes; the export handler only finds inputs.
nwb = [
    "tank-lab-to-nwb; python_version < '3.14'",
]

[tool.setuptools]
packages = {find = {include = ["u19_pipeline*", "scripts*"]}}


[tool.hatch.version]
path = "scripts/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/scripts",
    "/u19_pipeline",
]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.0.0",
    "ruff>=0.9.10",
    "setuptools>=75.8.0"
]

[tool.uv]
exclude-newer = "14 days"
# neuroconv needs the zarr 2 API at import (catalystneuro/neuroconv#2062), as
# tank-lab-to-nwb's own constraint says; uv doesn't take a dependency's constraints.
constraint-dependencies = ["zarr<3"]

[tool.uv.sources]
# Pinned to a commit. Bump it when the converter changes; the export calls
# tank_lab_to_nwb.imaging.convert.convert_session and .suite2p.convert_suite2p.
tank-lab-to-nwb = { git = "https://github.com/BrainCOGS/tank-lab-to-nwb", rev = "61aab99b0385c5f6a1bd32fed05a025038f15dc0" }
# tank-lab-to-nwb installs this from its tag until it's on PyPI, and uv doesn't
# take a dependency's sources, so it's repeated here.
ndx-tank-metadata = { git = "https://github.com/BrainCOGS/ndx-tank-metadata", tag = "v0.5.0" }
