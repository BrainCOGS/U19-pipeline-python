[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "u19-pipeline"
version = "0.4.0"
description = "Datajoint schemas for Princeton U19"
readme = "README.md"
authors = [
    { name = "DataJoint", email = "support@datajoint.com" },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu" },
]
dependencies = [
    "datajoint<2.0.0",
    "icalevents>=0.3.0",
    "numpy>=1.23",
    "pandas>=2.0",
    "python-dotenv>=0.20",
    "scikit-image",
    "scipy",
    "tables>=3.8",
    "astropy>=6.0",
    "openpyxl"
]
requires-python = ">=3.12"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.14",
    "jupyterlab>=4.3.4",
]
pipeline = [
    "cellpose",
    "bitstring",
    "fair-research-login",
    "ecephys_spike_sorting @ git+https://github.com/jenniferColonell/ecephys_spike_sorting.git",
    "element-array-ephys @ git+https://github.com/BrainCOGS/element-array-ephys.git",
    "element-calcium-imaging @ git+https://github.com/BrainCOGS/element-calcium-imaging.git",
    "element-interface @ git+https://github.com/datajoint/element-interface.git",
    "ecephys-spike-sorting>=0.1.0",
    "paramiko",
    "psutil",
    "scp",
    "scanreader @ git+https://github.com/BrainCOGS/scanreader.git",
    "six",
    "suite2p==1.1.0",  # settings mapping in element-calcium-imaging suite2p_settings.py is verified against 1.1.0
    "tifffile",
]

[tool.setuptools]
packages = {find = {include = ["u19_pipeline*", "scripts*"]}}


[tool.hatch.version]
path = "scripts/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/scripts",
    "/u19_pipeline",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.9.10",
    "setuptools>=75.8.0"
]

[tool.pytest.ini_options]
minversion = "9.0"
# pytest 9 reads pyproject.toml natively and needs "args"-type options as TOML lists.
addopts = ["-ra", "--showlocals", "--strict-config", "--strict-markers", "--import-mode=importlib", "--doctest-modules"]
xfail_strict = true
log_level = "INFO"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "db: needs a DataJoint database (dj_local_conf.json + reachable server); skipped when unavailable, see tests/dbskip.py",
]
filterwarnings = [
    "error",
    # datajoint<2 imports pkg_resources; setuptools>=81 warns about it as a
    # UserWarning, so the category stays unpinned.
    "ignore:pkg_resources is deprecated as an API",
    # datajoint calls pyparsing APIs that pyparsing has deprecated
    # (setResultsName, delimitedList, ...). Fires at import; not fixable here.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]

[tool.uv]
exclude-newer = "14 days"
# `uv audit` is still behind a preview flag. Declaring it here lets CI and
# local runs call `uv audit` without `--preview-features audit-command`.
preview-features = ["audit-command"]
